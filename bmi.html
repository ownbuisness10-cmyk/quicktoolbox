<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI Calculator</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}
.container{
background:#fff;
padding:25px;
width:320px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,.2);
text-align:center;
}
input{
width:90%;
padding:12px;
margin:10px 0;
font-size:16px;
}
button{
background:#2196F3;
color:#fff;
border:none;
padding:12px 20px;
font-size:18px;
border-radius:8px;
cursor:pointer;
}
#result{
margin-top:20px;
font-size:20px;
font-weight:bold;
color:green;
}
a{
display:block;
margin-top:20px;
text-decoration:none;
color:#2196F3;
}
</style>
</head>

<body>

<div class="container">

<h1>BMI Calculator</h1>

<input type="number" id="weight" placeholder="Weight (kg)">

<input type="number" id="height" placeholder="Height (cm)">

<button onclick="calculateBMI()">Calculate BMI</button>

<div id="result"></div>

<a href="index.html">⬅ Back to Home</a>

</div>

<script>
function calculateBMI(){

let weight=parseFloat(document.getElementById("weight").value);
let height=parseFloat(document.getElementById("height").value)/100;

if(!weight || !height){
alert("Please fill all fields");
return;
}

let bmi=weight/(height*height);

let status="";

if(bmi<18.5)
status="Underweight";
else if(bmi<25)
status="Normal";
else if(bmi<30)
status="Overweight";
else
status="Obese";

document.getElementById("result").innerHTML=
"BMI: "+bmi.toFixed(1)+"<br>"+status;

}
</script>

</body>
</html>
