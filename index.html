<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickToolBox - Age Calculator</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
text-align:center;
padding:40px;
}

.container{
max-width:350px;
margin:auto;
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

h1{
color:#2196F3;
}

input{
width:90%;
padding:12px;
margin:10px 0;
font-size:16px;
}

button{
background:#2196F3;
color:white;
padding:12px 20px;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#1976D2;
}

#result{
margin-top:20px;
font-size:20px;
font-weight:bold;
color:green;
}
</style>

</head>

<body>

<div class="container">

<h1>QuickToolBox</h1>
<p>Age Calculator</p>

<input type="date" id="dob">

<br>

<button onclick="calculateAge()">
Calculate Age
</button>

<div id="result"></div>

</div>

<script>

function calculateAge(){

let dob=document.getElementById("dob").value;

if(dob==""){
alert("Please select your Date of Birth");
return;
}

let birth=new Date(dob);
let today=new Date();

let age=today.getFullYear()-birth.getFullYear();

let month=today.getMonth()-birth.getMonth();

if(month<0 || (month===0 && today.getDate()<birth.getDate())){
age--;
}

document.getElementById("result").innerHTML=
"🎉 Your Age is <br><br>"+age+" Years";

}

</script>

</body>
</html>
