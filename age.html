<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age Calculator</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:#fff;
padding:25px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,.2);
width:320px;
text-align:center;
}

h1{
color:#2196F3;
}

input{
width:90%;
padding:12px;
font-size:16px;
margin:15px 0;
}

button{
background:#2196F3;
color:white;
border:none;
padding:12px 20px;
font-size:18px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#1976D2;
}

#result{
margin-top:20px;
font-size:20px;
font-weight:bold;
color:green;
}

a{
display:block;
margin-top:20px;
text-decoration:none;
color:#2196F3;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>Age Calculator</h1>

<input type="date" id="dob">

<br>

<button onclick="calculateAge()">Calculate Age</button>

<div id="result"></div>

<a href="index.html">⬅ Back to Home</a>

</div>

<script>
function calculateAge(){

let dob=document.getElementById("dob").value;

if(dob==""){
alert("Please select your birth date");
return;
}

let birth=new Date(dob);
let today=new Date();

let age=today.getFullYear()-birth.getFullYear();

let month=today.getMonth()-birth.getMonth();

if(month<0 || (month===0 && today.getDate()<birth.getDate())){
age--;
}

document.getElementById("result").innerHTML="Your Age is "+age+" Years";
}
</script>

</body>
</html>
